# LinkedIn Auto Poster - Daily Posts + Weekly PDF Q&A + Mon & Thu Tech PDF
# Schedule summary:
#   Daily text posts       : 6 PM IST (12:30 UTC) and 9:30 PM IST (15:00 UTC)
#   Tue & Fri PDF Q&A      : 10 PM IST (16:30 UTC)
#   Mon & Thu Tech PDF     : 10:30 PM IST (17:00 UTC)
name: LinkedIn Daily Auto Poster + Weekly PDF Q&A + Thursday Tech PDF

on:
  schedule:
    # Daily text posts: 6 PM & 9:30 PM IST
    - cron: '30 12 * * *'  # 6 PM IST (12:30 UTC)
    - cron: '0 15 * * *'   # 9:30 PM IST (15:00 UTC)

    # Weekly PDF Q&A: Tuesday & Friday at 10 PM IST (16:30 UTC)
    - cron: '30 16 * * 2'  # Tuesday 10 PM IST
    - cron: '30 16 * * 5'  # Friday  10 PM IST

    # Weekly Tech PDF: Monday & Thursday at 10:30 PM IST (17:00 UTC)
    - cron: '0 17 * * 1'   # Monday    10:30 PM IST (17:00 UTC)
    - cron: '0 17 * * 4'   # Thursday  10:30 PM IST (17:00 UTC)

  workflow_dispatch:  # Manual trigger

jobs:
  determine_job:
    runs-on: ubuntu-latest
    outputs:
      job_type: ${{ steps.check.outputs.job_type }}
    steps:
      - name: Determine which job to run
        id: check
        run: |
          # Use the exact cron string that triggered this run (reliable — no clock drift issues)
          SCHEDULE="${{ github.event.schedule }}"

          if [[ "$SCHEDULE" == "0 17 * * 1" || "$SCHEDULE" == "0 17 * * 4" ]]; then
            echo "job_type=weekly_tech" >> $GITHUB_OUTPUT
          elif [[ "$SCHEDULE" == "30 16 * * 2" || "$SCHEDULE" == "30 16 * * 5" ]]; then
            echo "job_type=pdf" >> $GITHUB_OUTPUT
          else
            echo "job_type=daily" >> $GITHUB_OUTPUT
          fi

  post_daily:
    needs: determine_job
    if: needs.determine_job.outputs.job_type == 'daily'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Pull latest tracker file
        run: |
          git config --global user.email "autoposter@github.com"
          git config --global user.name "Auto Poster"
          git pull --rebase origin main || true
      
      - name: Run LinkedIn Auto Poster (Daily)
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          PERSON_URN: ${{ secrets.PERSON_URN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python post.py
      
      - name: Save tracker file back to repo
        run: |
          git add last_posts.json || true
          git diff --staged --quiet || git commit -m "Update rotation tracker [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post_pdf_qa:
    needs: determine_job
    if: needs.determine_job.outputs.job_type == 'pdf'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests reportlab

      - name: Run LinkedIn PDF Q&A Poster (Tue & Fri 10 PM IST)
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          PERSON_URN: ${{ secrets.PERSON_URN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python post_pdf_qa.py

  # ── NEW: Weekly Thursday 7 PM IST Tech PDF ──────────────────────────────────
  post_weekly_tech_pdf:
    needs: determine_job
    if: needs.determine_job.outputs.job_type == 'weekly_tech'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests reportlab

      - name: Run Weekly Thursday Tech PDF Poster (Thursday 7 PM IST)
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          PERSON_URN: ${{ secrets.PERSON_URN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python post_pdf_weekly_tech.py

      - name: Save rotation tracker back to repo
        run: |
          git config --global user.email "autoposter@github.com"
          git config --global user.name "Auto Poster"
          git add last_weekly_tech.json || true
          git diff --staged --quiet || git commit -m "Update weekly tech rotation tracker [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
